name: pins-self

# Runs this change's own copy of scripts/check-pins.py and its tests. It is
# what tests a change to the rule. The rule a pull request must pass comes
# from the base branch: see pins.yml.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pins-self-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pins-self:
    name: pins-self
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: The rule's own tests
        run: python3 -I -B scripts/test_check_pins.py
      - name: This change's rule judges this change's catalog
        run: |
          git ls-tree -r -z --name-only HEAD > "$RUNNER_TEMP/paths"
          python3 -I -B scripts/check-pins.py .claude-plugin/marketplace.json "$RUNNER_TEMP/paths"
