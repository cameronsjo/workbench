name: pins

# Every Claude Code mod in the catalog is pinned to one reviewed commit.
# See scripts/check-pins.py for the rule.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pins-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pins:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: The check's own tests
        run: python3 -I -B scripts/test_check_pins.py
      - name: Every mod is pinned by commit
        run: python3 -I -B scripts/check-pins.py
