name: pins

# The catalog holds known source shapes only, and every Claude Code mod is
# pinned to one commit. The rule is scripts/check-pins.py.
#
# Two jobs:
#
# - `pins` runs on pull_request_target. It uses the rule from the base branch
#   and reads the pull request's catalog as data, so a pull request cannot
#   relax the rule it is judged by. This is the job to require.
#   It runs no file from the pull request: the one file it takes is JSON, read
#   with `git show` into a temporary file and parsed. Keep it that way. Never
#   check out, source or execute the pull request's tree in this job.
# - `pins-self` runs the change's own copy of the rule and the rule's tests,
#   on pull requests and on main. It is what tests a change to the rule.

on:
  pull_request:
  pull_request_target:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pins-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  pins:
    name: pins
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the base branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: The base rule judges the pull request's catalog
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_NUMBER" in ''|*[!0-9]*) echo "bad pull request number"; exit 1 ;; esac
          case "$PR_HEAD" in *[!0-9a-f]*) echo "bad head sha"; exit 1 ;; esac
          [ "${#PR_HEAD}" -eq 40 ] || { echo "bad head sha"; exit 1; }
          git fetch --quiet --no-tags --depth=1 origin "+refs/pull/${PR_NUMBER}/head:refs/remotes/pr/head"
          fetched=$(git rev-parse --verify --quiet refs/remotes/pr/head) || { echo "the pull request head could not be read"; exit 1; }
          [ "$fetched" = "$PR_HEAD" ] || { echo "the pull request moved to $fetched while this ran; the newer run judges it"; exit 1; }
          git show "refs/remotes/pr/head:.claude-plugin/marketplace.json" > "$RUNNER_TEMP/marketplace.json"
          python3 -I -B scripts/check-pins.py "$RUNNER_TEMP/marketplace.json"

  pins-self:
    name: pins-self
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: The rule's own tests
        run: python3 -I -B scripts/test_check_pins.py
      - name: This change's rule judges this change's catalog
        run: python3 -I -B scripts/check-pins.py
